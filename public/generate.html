<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalMind - توليد العقود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        header { background: #1a5276; color: white; padding: 20px 30px; border-radius: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 22px; }
        .auth-info { display: flex; gap: 10px; align-items: center; }
        .auth-info input { padding: 8px 12px; border: none; border-radius: 5px; font-size: 13px; width: 320px; }
        .auth-info button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; background: #27ae60; color: white; }
        .auth-info button:hover { background: #219a52; }

        .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 17px; margin-bottom: 15px; color: #1a5276; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; font-weight: 600; }
        textarea, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; resize: vertical; }
        textarea:focus, input:focus { outline: none; border-color: #3498db; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: #2980b9; color: white; } .btn-primary:hover { background: #2471a3; }
        .btn-success { background: #27ae60; color: white; } .btn-success:hover { background: #219a52; }
        .btn-warning { background: #f39c12; color: white; } .btn-warning:hover { background: #d68910; }
        .btn-danger { background: #e74c3c; color: white; } .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

        .job-list { max-height: 400px; overflow-y: auto; }
        .job-item { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .job-item:hover { border-color: #3498db; background: #f8fbff; }
        .job-item.active { border-color: #2980b9; background: #eaf2f8; }
        .job-item .job-prompt { font-size: 13px; color: #555; margin-bottom: 6px; }
        .job-item .job-meta { display: flex; gap: 10px; font-size: 11px; color: #888; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .status-queued { background: #fdebd0; color: #e67e22; }
        .status-processing { background: #d4efdf; color: #27ae60; }
        .status-completed { background: #d5f5e3; color: #1e8449; }
        .status-failed { background: #fadbd8; color: #e74c3c; }

        .contract-preview { background: #fdfefe; border: 1px solid #eee; border-radius: 8px; padding: 20px; min-height: 300px; white-space: pre-wrap; line-height: 1.9; font-size: 14px; direction: rtl; text-align: right; }
        .contract-preview .placeholder { background: #fff3cd; border: 1px dashed #f0ad4e; padding: 2px 6px; border-radius: 4px; color: #856404; font-weight: 600; }

        .validation-result { margin-top: 15px; padding: 15px; border-radius: 8px; }
        .validation-pass { background: #d5f5e3; border: 1px solid #27ae60; }
        .validation-fail { background: #fadbd8; border: 1px solid #e74c3c; }
        .validation-result h3 { margin-bottom: 10px; font-size: 15px; }
        .issue-item { padding: 8px; background: white; border-radius: 5px; margin-bottom: 6px; font-size: 13px; border-right: 3px solid #e74c3c; }

        .log-area { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; direction: ltr; text-align: left; }

        .empty-state { text-align: center; padding: 40px; color: #aaa; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .score-bar { height: 8px; background: #eee; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>توليد العقود بالذكاء الاصطناعي</h1>
            <div class="auth-info">
                <input type="text" id="tokenInput" placeholder="الصق JWT token هنا..." />
                <button onclick="saveToken()">حفظ التوكن</button>
                <span id="authStatus" style="font-size:12px; opacity:0.7">غير مُصرّح</span>
            </div>
        </header>

        <div class="grid">
            <!-- Right Column: Controls -->
            <div>
                <!-- Create New -->
                <div class="card" style="margin-bottom: 20px;">
                    <h2>tوليد عقد جديد</h2>
                    <label>اوصف العقد المطلوب:</label>
                    <textarea id="promptInput" rows="4" placeholder="مثال: أريد عقد عمل لمهندس برمجيات براتب 15000 جنيه ومدة سنة..."></textarea>
                    <div class="actions" style="margin-top: 10px;">
                        <button class="btn btn-primary" onclick="createJob()">توليد العقد</button>
                        <button class="btn btn-success" onclick="listJobs()">تحديث القائمة</button>
                    </div>
                </div>

                <!-- Job List -->
                <div class="card">
                    <h2>طلبات التوليد</h2>
                    <div id="jobList" class="job-list">
                        <div class="empty-state">اضغط "تحديث القائمة" لعرض الطلبات</div>
                    </div>
                </div>
            </div>

            <!-- Left Column: Result -->
            <div>
                <!-- Progress Log -->
                <div class="card" style="margin-bottom: 20px;">
                    <h2>سجل التقدم</h2>
                    <div id="logArea" class="log-area">بانتظار بدء التوليد...</div>
                </div>

                <!-- Contract Preview -->
                <div class="card" style="margin-bottom: 20px;">
                    <h2>العقد المولد</h2>
                    <div id="contractPreview" class="contract-preview">
                        <div class="empty-state">اختر طلباً من القائمة لعرض النتيجة</div>
                    </div>
                    <div style="margin-top: 12px;">
                        <label>تعليمات إعادة التوليد:</label>
                        <input type="text" id="regenerateInput" placeholder="مثال: غيّر الرواتب إلى 20000 جنيه..." />
                    </div>
                    <div class="actions">
                        <button class="btn btn-warning btn-sm" onclick="editContract()" id="btnEdit" disabled>حفظ التعديلات</button>
                        <button class="btn btn-info btn-sm" onclick="regenerateContract()" id="btnRegenerate" disabled style="background:#8e44ad; color:white;">إعادة التوليد</button>
                        <button class="btn btn-success btn-sm" onclick="validateContract()" id="btnValidate" disabled>التحقق من الامتثال</button>
                        <button class="btn btn-primary btn-sm" onclick="downloadContract()" id="btnDownload" disabled>تحميل Markdown</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteJob()" id="btnDelete" disabled>حذف</button>
                    </div>
                </div>

                <!-- Validation Result -->
                <div class="card" id="validationCard" style="display:none;">
                    <h2>نتيجة التحقق</h2>
                    <div id="validationResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let token = localStorage.getItem('accessToken') || '';
        let currentJobId = null;
        let pollInterval = null;

        // ── Auth ──
        document.getElementById('tokenInput').value = token;
        updateAuthStatus();

        function saveToken() {
            token = document.getElementById('tokenInput').value.trim();
            localStorage.setItem('accessToken', token);
            updateAuthStatus();
        }

        function updateAuthStatus() {
            const el = document.getElementById('authStatus');
            el.textContent = token ? 'مصرّح ✓' : 'غير مُصرّح';
            el.style.color = token ? '#2ecc71' : '#e74c3c';
        }

        function headers() {
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        async function api(method, path, body) {
            const opts = { method, headers: headers() };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API + path, opts);
            return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
        }

        // ── Create Job ──
        async function createJob() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) { alert('اوصف العقد المطلوب'); return; }
            if (!token) { alert('الصق التوكن أولاً'); return; }

            const { ok, data } = await api('POST', '/api/generate', { prompt });
            if (ok && data.data) {
                currentJobId = data.data.jobId;
                addLog(`✅ تم إرسال الطلب — المعرّف: ${currentJobId}`);
                listJobs();
                pollProgress(currentJobId);
            } else {
                addLog(`❌ فشل: ${data.message || 'خطأ غير معروف'}`);
            }
        }

        // ── List Jobs ──
        async function listJobs() {
            if (!token) return;
            const { ok, data } = await api('GET', '/api/generate');
            const container = document.getElementById('jobList');

            if (!ok || !data.data || data.data.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد طلبات بعد</div>';
                return;
            }

            container.innerHTML = data.data.map(j => `
                <div class="job-item ${j.jobId === currentJobId ? 'active' : ''}" onclick="selectJob('${j.jobId}')">
                    <div class="job-prompt">${escapeHtml(j.promptExcerpt || '')}</div>
                    <div class="job-meta">
                        <span class="status-badge status-${j.status}">${j.status}</span>
                        <span>${new Date(j.createdAt).toLocaleString('ar-EG')}</span>
                        <span style="font-size:10px; color:#aaa">${j.jobId.substring(0, 8)}...</span>
                    </div>
                </div>
            `).join('');
        }

        // ── Select Job ──
        async function selectJob(jobId) {
            currentJobId = jobId;
            document.querySelectorAll('.job-item').forEach(el => el.classList.remove('active'));
            event.currentTarget?.classList.add('active');

            const { ok, data } = await api('GET', `/api/generate/${jobId}`);
            if (!ok) { addLog('❌ فشل جلب بيانات العقد'); return; }

            const d = data.data;
            document.getElementById('logArea').textContent = `الحالة: ${d.status}`;

            if (d.status === 'completed' && d.result) {
                renderContract(d.result.contractMarkdown, d.result.placeholders);
                setButtons(true);
                if (d.result.validationResult) showValidation(d.result.validationResult);
            } else if (d.status === 'processing') {
                document.getElementById('contractPreview').innerHTML = '<div class="empty-state">جاري التوليد... <span class="spinner"></span></div>';
                setButtons(false);
                pollProgress(jobId);
            } else {
                document.getElementById('contractPreview').innerHTML = `<div class="empty-state">الحالة: ${d.status}</div>`;
                setButtons(false);
            }
        }

        // ── Render Contract ──
        function renderContract(markdown, placeholders) {
            let html = escapeHtml(markdown);
            if (placeholders && placeholders.length > 0) {
                placeholders.forEach(p => {
                    const regex = new RegExp(`\\{\\{${p.field}:.*?\\}\\}`, 'g');
                    html = html.replace(regex, `<span class="placeholder" title="${p.label}">${p.filled ? p.label : '___'}</span>`);
                });
            }
            document.getElementById('contractPreview').innerHTML = html;
        }

        // ── Edit (save) ──
        async function editContract() {
            if (!currentJobId) return;
            const text = document.getElementById('contractPreview').innerText;
            const { ok, data } = await api('PUT', `/api/generate/${currentJobId}`, { editedMarkdown: text });
            addLog(ok ? '✅ تم حفظ التعديلات' : `❌ ${data.message}`);
        }

        // ── Regenerate ──
        async function regenerateContract() {
            if (!currentJobId) return;
            const instructions = document.getElementById('regenerateInput').value.trim();
            if (!instructions) { alert('أدخل تعديلات التوليد أولاً'); return; }

            document.getElementById('btnRegenerate').disabled = true;
            document.getElementById('btnRegenerate').innerHTML = 'جاري التوليد... <span class="spinner"></span>';
            addLog(`🔄 جاري إعادة التوليد: ${instructions}`);

            const { ok, data } = await api('POST', `/api/generate/${currentJobId}/regenerate`, { instructions });
            document.getElementById('btnRegenerate').disabled = false;
            document.getElementById('btnRegenerate').textContent = 'إعادة التوليد';

            if (ok && data.data) {
                renderContract(data.data.contractMarkdown, data.data.placeholders);
                addLog('✅ تم إعادة التوليد بنجاح');
                document.getElementById('regenerateInput').value = '';
            } else {
                addLog(`❌ ${data.message}`);
            }
        }

        // ── Validate ──
        async function validateContract() {
            if (!currentJobId) return;
            document.getElementById('btnValidate').disabled = true;
            document.getElementById('btnValidate').innerHTML = 'جاري الفحص... <span class="spinner"></span>';
            addLog('⚖️ جاري التحقق من الامتثال...');

            const { ok, data } = await api('POST', `/api/generate/${currentJobId}/validate`);
            document.getElementById('btnValidate').disabled = false;
            document.getElementById('btnValidate').textContent = 'التحقق من الامتثال';

            if (ok && data.data) {
                showValidation(data.data.validationResult);
                addLog(`✅ النتيجة: ${data.data.validationResult.score}/100`);
            } else {
                addLog(`❌ فشل التحقق: ${data.message}`);
            }
        }

        function showValidation(v) {
            const card = document.getElementById('validationCard');
            const el = document.getElementById('validationResult');
            card.style.display = 'block';

            const color = v.score >= 70 ? '#27ae60' : v.score >= 50 ? '#f39c12' : '#e74c3c';
            el.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0; color:${color}">النتيجة: ${v.score}/100</h3>
                    <span class="status-badge ${v.valid ? 'status-completed' : 'status-failed'}">${v.valid ? 'مطابق' : 'يحتاج مراجعة'}</span>
                </div>
                <div class="score-bar"><div class="score-fill" style="width:${v.score}%; background:${color}"></div></div>
                <p style="font-size:13px; color:#666; margin-bottom:10px;">مواد ممتثلة: ${v.compliantClauses}/${v.totalClauses}</p>
                ${v.issues.length > 0 ? '<p style="font-size:13px; font-weight:600; margin-bottom:6px;">المشاكل:</p>' + v.issues.map(i => `
                    <div class="issue-item">
                        <strong>${i.status === 'non_compliant' ? '❌' : '⚠️'} ${i.clause}</strong><br/>
                        <span>${i.explanation}</span><br/>
                        ${i.suggestedFix ? `<em style="color:#27ae60; font-size:12px;">💡 ${i.suggestedFix}</em>` : ''}
                    </div>
                `).join('') : '<p style="color:#27ae60; font-size:13px;">✅ لا توجد مشاكل</p>'}
            `;
        }

        // ── Download ──
        async function downloadContract() {
            if (!currentJobId) return;
            const res = await fetch(API + `/api/generate/${currentJobId}/download`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) { addLog('❌ فشل التحميل'); return; }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `contract_${currentJobId.substring(0, 8)}.md`;
            a.click(); URL.revokeObjectURL(url);
            addLog('✅ تم التحميل');
        }

        // ── Delete ──
        async function deleteJob() {
            if (!currentJobId || !confirm('هل أنت متأكد من الحذف؟')) return;
            const { ok, data } = await api('DELETE', `/api/generate/${currentJobId}`);
            if (ok) {
                addLog('✅ تم الحذف');
                currentJobId = null;
                document.getElementById('contractPreview').innerHTML = '<div class="empty-state">اختر طلباً من القائمة</div>';
                setButtons(false);
                listJobs();
            } else {
                addLog(`❌ ${data.message}`);
            }
        }

        // ── Poll Progress ──
        function pollProgress(jobId) {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                const { ok, data } = await api('GET', `/api/generate/${jobId}`);
                if (!ok || !data.data) return;

                const d = data.data;
                if (d.status === 'completed') {
                    clearInterval(pollInterval);
                    addLog('✅ اكتمل التوليد!');
                    listJobs();
                    selectJobById(jobId);
                } else if (d.status === 'failed') {
                    clearInterval(pollInterval);
                    addLog(`❌ فشل: ${d.error || 'خطأ غير معروف'}`);
                } else if (d.currentStage) {
                    addLog(`⏳ ${d.currentStage}`);
                }
            }, 3000);
        }

        async function selectJobById(jobId) {
            currentJobId = jobId;
            const { ok, data } = await api('GET', `/api/generate/${jobId}`);
            if (ok && data.data?.result) {
                renderContract(data.data.result.contractMarkdown, data.data.result.placeholders);
                setButtons(true);
            }
        }

        // ── Helpers ──
        function setButtons(enabled) {
            document.getElementById('btnEdit').disabled = !enabled;
            document.getElementById('btnRegenerate').disabled = !enabled;
            document.getElementById('btnValidate').disabled = !enabled;
            document.getElementById('btnDownload').disabled = !enabled;
            document.getElementById('btnDelete').disabled = !enabled;
        }

        function addLog(msg) {
            const el = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString('ar-EG');
            el.textContent += `\n[${time}] ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Auto-load on start
        if (token) listJobs();
    </script>
</body>
</html>
